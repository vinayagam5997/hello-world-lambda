AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Resources:

  HelloWorldFunction:

    Type: AWS::Serverless::Function

    Properties:

      FunctionName: hello-world-lambda

      Runtime: java17

      Handler: com.vinay.Handler

      CodeUri: target/hello-world-lambda-1.0.jar

      MemorySize: 512

      Timeout: 30

      Role: !GetAtt HelloWorldLambdaRole.Arn

  HelloWorldLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: hello-world-lambda-role

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole